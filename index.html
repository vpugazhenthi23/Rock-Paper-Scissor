<body style="margin:20px">
    <h3>Rock paper Scissors</h3>
    <button onclick="update('Rock');"class="btn-icon">
        <img src="Images/Rock-emoji.png" class="move-icon">
    </button>
    <button onclick="update('Paper');"class="btn-icon">
        <img src="Images/Paper-emoji.png" class="move-icon">
    </button>
    <button onclick="update('Scissor');"class="btn-icon">
        <img src="Images/Scissor-emoji.png" class="move-icon">
    </button>
    <p class="move"></p>
    <p class="results result-icon"></p>
    <p class="js-score run-icon"></p>
    
    <button class="js-reset reset-icon" onclick=" 
        score.wins=0;
        score.Lose=0;
        score.Ties=0;
            localStorage.removeItem('score');
            scc();
            document.querySelector('.move' ).innerHTML = '';
            document.querySelector('.results' ).innerHTML = '';
    ">Reset Score</button>
    <button class="auto-btn" onclick="playAuto()">Auto-OFF</button>
    <script src="10.2 project .js"></script>
