<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-card">
        <h1>Rock Paper Scissors</h1>
        <p class="subtitle">Choose your move and see if you can beat the computer.</p>

        <div class="move-choices">
            <button type="button" class="btn-icon" aria-label="Choose rock" onclick="update('Rock');">
                <img src="Images/Rock-emoji.png" class="move-icon" alt="">
            </button>
            <button type="button" class="btn-icon" aria-label="Choose paper" onclick="update('Paper');">
                <img src="Images/Paper-emoji.png" class="move-icon" alt="">
            </button>
            <button type="button" class="btn-icon" aria-label="Choose scissors" onclick="update('Scissor');">
                <img src="Images/Scissor-emoji.png" class="move-icon" alt="">
            </button>
        </div>

        <p class="move"></p>
        <p class="results result-icon"></p>
        <p class="js-score run-icon"></p>

        <div class="game-actions">
            <button type="button" class="js-reset reset-icon">Reset Score</button>
            <button type="button" class="auto-btn" onclick="playAuto()">Auto-OFF</button>
        </div>
        <div class="auto-alert" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="js-text"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
